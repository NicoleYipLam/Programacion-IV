
{% extends "base.html" %}

{% block title %}Editar libro{% endblock %}

{% block content %}

<div class="card shadow">
    <div class="card-header bg-warning">
        <h3>Editar información del libro</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" name="titulo"
                       class="form-control"
                       value="{{ libro.titulo }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Autor</label>
                <input type="text" name="autor"
                       class="form-control"
                       value="{{ libro.autor }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Género</label>
                <input type="text" name="genero"
                       class="form-control"
                       value="{{ libro.genero }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Estado de lectura</label>

                <select name="estado" class="form-select" required>
                    <option value="Pendiente"
                        {% if libro.estado == "Pendiente" %}selected{% endif %}>
                        Pendiente
                    </option>

                    <option value="Leyendo"
                        {% if libro.estado == "Leyendo" %}selected{% endif %}>
                        Leyendo
                    </option>

                    <option value="Leído"
                        {% if libro.estado == "Leído" %}selected{% endif %}>
                        Leído
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">
                Guardar cambios
            </button>

            <a href="/" class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>
</div>

{% endblock %}
