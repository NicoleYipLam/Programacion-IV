{% extends "base.html" %}

{% block title %}Agregar libro{% endblock %}

{% block content %}

<h2>Agregar nuevo libro</h2>

<p>Completa los siguientes datos para registrar un libro.</p>

<form method="POST">

    <label for="titulo">Título del libro</label>
    <input
        type="text"
        id="titulo"
        name="titulo"
        placeholder="Escribe el título"
        required
    >

    <label for="autor">Autor</label>
    <input
        type="text"
        id="autor"
        name="autor"
        placeholder="Escribe el nombre del autor"
        required
    >

    <label for="anio">Año de publicación</label>
    <input
        type="number"
        id="anio"
        name="anio"
        placeholder="Ejemplo: 2020"
        required
    >

    <button type="submit">Guardar libro</button>

    <a href="{{ url_for('index') }}">Cancelar</a>

</form>

{% endblock %}
