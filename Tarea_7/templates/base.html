
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mi Biblioteca{% endblock %}</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <div class="navbar">
            <h1>Mi Biblioteca</h1>

            <nav>
                <a href="{{ url_for('index') }}">Inicio</a>
                <a href="{{ url_for('agregar') }}">Agregar libro</a>
            </nav>
        </div>
    </header>

    <main>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="mensaje {{ categoria }}">
                        {{ mensaje }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        <p>Mi Biblioteca Personal</p>
    </footer>

</body>
</html>
